<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Music Player</title>
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="cropped_image.png" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
  <script src="https://kit.fontawesome.com/f5b6191954.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="hamburger" onclick="toggleMenu()">☰</div>

  <div class="playlist" id="playlist"></div>

  <div class="player">
    <!-- <h2 id="title">Loading...</h2> -->
    <audio id="audio" src="songs/Attack on Titan Season 4 OST - Ashes on The FireMain Theme.mp3"></audio>
    <img id="poster" src="images/poster1.jpeg" alt="Poster" class="poster">
    <h2 id="title">Loading...</h2>
<input type="range" id="progress" value="0" min="0" max="100">
    <div class="controls">
      <button onclick="prevSong()"><i class="fa-solid fa-backward"></i></button>
      <button onclick="togglePlay()" id="playBtn"><i class="fa-solid fa-play"></i></button>
      <button onclick="nextSong()"><i class="fa-solid fa-forward"></i></button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
